<script type="application/ld+json">[{"@context":"https://schema.org","@type":"WebPage","url":"https://allfreecalculators.in/reset-password/","name":"Reset Password","description":"Create a new password for your account","inLanguage":"en-IN"}]</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f7f8fc;--fg:#0f172a;--muted:#64748b;--card:#fff;--line:#e6e8f0;--brand:#4f46e5;--brand2:#7c3aed;--accent:#06b6d4;--error:#ef4444;--success:#22c55e;--warning:#f97316}body.dark{--bg:#0b1020;--fg:#e5e9f5;--muted:#94a3b8;--card:#141a2e;--line:#233}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.auth-page{min-width:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--bg)}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 32px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo .mark{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:1.5rem;font-weight:900}
.auth-logo h1{font-size:1.3rem;font-weight:800;margin-top:12px;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{color:var(--muted);font-size:.9rem;margin-top:4px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--fg)}
.form-group input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;font-size:1rem;background:var(--bg);color:var(--fg);outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--brand)}
.form-group input::placeholder{color:var(--muted)}
.form-error{color:var(--error);font-size:.82rem;margin-top:4px;display:none}
.form-error.visible{display:block}
.form-error.general{color:var(--error);text-align:center;background:rgba(239,68,68,.1);padding:12px;border-radius:8px;margin-bottom:20px;border:1px solid rgba(239,68,68,.2);display:none}
.form-error.general.visible{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:.95rem;border:0;cursor:pointer;width:100%;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.btn.primary:hover{opacity:.92}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.auth-footer{text-align:center;margin-top:24px;font-size:.88rem;color:var(--muted)}
.auth-footer a{color:var(--brand);font-weight:600}
.auth-footer a:hover{text-decoration:underline}
.alert{padding:12px 16px;border-radius:12px;font-size:.88rem;margin-bottom:20px;display:none}
.alert.error{background:rgba(239,68,68,.1);color:var(--error);border:1px solid rgba(239,68,68,.2);display:block}
.alert.success{background:rgba(34,197,94,.1);color:var(--success);border:1px solid rgba(34,197,94,.2);display:block}
.alert.warning{background:rgba(249,115,22,.1);color:var(--warning);border:1px solid rgba(249,115,22,.2);display:block}
.password-field{position:relative}
.password-field input{padding-right:44px}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strength-meter{margin-top:8px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.strength-meter-fill{height:100%;width:0%;background:var(--error);transition:width .3s}
.strength-meter-fill.medium{background:var(--warning)}
.strength-meter-fill.strong{background:var(--success)}
.password-requirements{background:rgba(249,115,22,.05);border:1px solid rgba(249,115,22,.2);border-radius:8px;padding:12px;margin-top:12px;display:none}
.password-requirements.visible{display:block}
.password-requirements h4{color:var(--warning);font-size:.85rem;margin-bottom:8px}
.password-requirements ul{color:var(--muted);font-size:.8rem;list-style:none;padding:0}
.password-requirements li{margin:4px 0;position:relative;padding-left:16px}
.password-requirements li:before{content:"✓";position:absolute;left:0;color:var(--success)}
@media(max-width:480px){.auth-card{padding:28px 20px}}
</style>
</head>
<body>
<div class="auth-page">
<div class="auth-card">
<div class="auth-logo">
<div class="mark">∑</div>
<h1>allfreecalculators.in</h1>
<p>Create new password</p>
</div>
<div class="alert" id="alert"></div>
<form id="resetForm" novalidate>
<input type="hidden" id="token" name="token"/>
<div class="form-group">
<label for="password">New Password (min 8 characters)</label>
<div class="password-field">
<input type="password" id="password" name="password" placeholder="Enter new password" required minlength="8" autocomplete="new-password"/>
<button type="button" class="toggle-pw" id="togglePw1" aria-label="Toggle password visibility">👁</button>
</div>
<div class="strength-meter"><div class="strength-meter-fill" id="strengthFill"></div></div>
<div class="password-requirements" id="pwReqs">
<h4>Password Requirements:</h4>
<ul>
<li>At least 8 characters</li>
<li>Contains uppercase letter</li>
<li>Contains lowercase letter</li>
<li>Contains number</li>
</ul>
</div>
<div class="form-error" id="passwordError">Password must meet all requirements.</div>
</div>
<div class="form-group">
<label for="confirm">Confirm New Password</label>
<div class="password-field">
<input type="password" id="confirm" name="confirm" placeholder="Confirm new password" required autocomplete="new-password"/>
<button type="button" class="toggle-pw" id="togglePw2" aria-label="Toggle password visibility">👁</button>
</div>
<div class="form-error" id="confirmError">Passwords do not match.</div>
</div>
<div class="form-error general" id="generalError"></div>
<button type="submit" class="btn primary" id="submitBtn">Reset Password</button>
</form>
<div class="auth-footer">Remember your password? <a href="/login/">Sign in</a></div>
</div>
</div>
<script>
(function(){var form=document.getElementById('resetForm');var alert=document.getElementById('alert');var submitBtn=document.getElementById('submitBtn');var token=document.getElementById('token');
token.value=new URLSearchParams(window.location.search).get('token')||'';
var togglePw1=document.getElementById('togglePw1');var togglePw2=document.getElementById('togglePw2');
togglePw1.addEventListener('click',function(){var t=document.getElementById('password').type==='password'?'text':'password';document.getElementById('password').type=t;togglePw1.textContent=t==='password'?'👁':'🙈';});
togglePw2.addEventListener('click',function(){var t=document.getElementById('confirm').type==='password'?'text':'password';document.getElementById('confirm').type=t;togglePw2.textContent=t==='password'?'👁':'🙈';});
document.getElementById('password').addEventListener('input',function(){var p=this.value;var strength=0;if(p.length>=8)strength+=1;if(/[a-z]/.test(p))strength+=1;if(/[A-Z]/.test(p))strength+=1;if(/[0-9]/.test(p))strength+=1;var fill=document.getElementById('strengthFill');fill.style.width=(strength*25)+'%';fill.className='strength-meter-fill '+(['','medium','medium','strong','strong'][strength]);var reqs=document.getElementById('pwReqs');reqs.classList.toggle('visible',strength>0);});
form.addEventListener('submit',function(e){e.preventDefault();var password=document.getElementById('password').value;var confirm=document.getElementById('confirm').value;var valid=true;
document.querySelectorAll('.form-error').forEach(function(el){el.classList.remove('visible')});
if(password.length<8||!/[a-z]/.test(password)||!/[A-Z]/.test(password)||!/[0-9]/.test(password)){document.getElementById('passwordError').classList.add('visible');valid=false;}
if(password!==confirm){document.getElementById('confirmError').classList.add('visible');valid=false;}
if(!token.value){alert.className='alert error';alert.textContent='Invalid or missing reset token. Please request a new password reset.';return;}
if(!valid)return;
submitBtn.disabled=true;submitBtn.innerHTML='<span class="spinner"></span> Resetting...';
fetch('/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value,password:password})}).then(function(r){return r.json();}).then(function(data){
if(data.ok){alert.className='alert success';alert.textContent=data.message||'Password reset successfully!';setTimeout(function(){window.location.href='/login/';},1500);}
else{var err=data.error||'Failed to reset password.';if(err.toLowerCase().includes('invalid')||err.toLowerCase().includes('expired')){alert.className='alert error';alert.textContent=err;submitBtn.disabled=false;submitBtn.textContent='Request new reset link';}
else{alert.className='alert error';alert.textContent=err;submitBtn.disabled=false;submitBtn.textContent='Reset Password';}
}}
).catch(function(){alert.className='alert error';alert.textContent='Network error. Please check your connection.';submitBtn.disabled=false;submitBtn.textContent='Reset Password';});
});
})();
</script>
</body>
</html>
