<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f7f8fc;--fg:#0f172a;--muted:#64748b;--card:#fff;--line:#e6e8f0;--brand:#4f46e5;--brand2:#7c3aed}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}

<script>document.getElementById('q').addEventListener('input',async(e)=>{const term=e.target.value.trim();const res=document.getElementById('results');if(term.length<2){res.innerHTML='';return}try{const r=await fetch('/api/search?q='+encodeURIComponent(term));const d=await r.json();res.innerHTML=(d.items||[]).map(i=>'<div style="padding:8px 0;border-bottom:1px solid #e6e8f0"><a href="'+i.url+'">'+i.title+'</a></div>').join('')||'No results found.'}catch(err){res.innerHTML='Search temporarily unavailable.'}});</script>
