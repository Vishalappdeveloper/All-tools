<style>

.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:10px;font-weight:700;font-size:1rem;border:0;cursor:pointer}

main{padding:40px 20px}

.dashboard-card h1{margin-bottom:20px;font-size:1.5rem;font-weight:900}
