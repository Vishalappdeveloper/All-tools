<link href="/favicon.ico" rel="icon"/>
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f7f8fc;--fg:#0f172a;--muted:#64748b;--card:#fff;--line:#e6e8f0;--brand:#4f46e5;--brand2:#7c3aed}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-weight:800;font-size:1.15rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.nav .links a{color:var(--muted);font-weight:600;font-size:.93rem;margin-right:14px;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:700;font-size:.9rem;border:0;cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.wrap{padding:40px 20px;max-width:1200px;margin:0 auto}
h1{font-size:1.8rem;font-weight:900;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
input{width:100%;max-width:480px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
footer.site{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:.85rem;margin-top:60px}
</style>
</head><body>
<header class="site"><div class="container nav"><a class="logo" href="/">allfreecalculators.in</a><nav class="links"><a href="/">Home</a><a href="/converters/all-calculators-converter/">Tools</a><a href="/blog/">Blog</a><a href="/category/">Categories</a></nav></div></header>

</div>
<footer class="site"><div class="container">© 2026 allfreecalculators.in — All rights reserved.</div></footer>
<script>function auth(){const t=localStorage.getItem('cfc_token');return t?{'Authorization':'Bearer '+t}:{}}document.getElementById('portal').addEventListener('click',async()=>{try{const r=await fetch('/api/payments/portal',{method:'POST',headers:auth()});const d=await r.json();if(d.url)window.location.href=d.url;else alert(d.error||'Billing portal not configured yet.')}catch(e){alert(e.message)}});</script>
