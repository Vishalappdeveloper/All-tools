<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin Login | allfreecalculators.in</title>
<meta name="robots" content="noindex,nofollow"/>
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f7f8fc;--fg:#0f172a;--muted:#64748b;--card:#fff;--line:#e6e8f0;--brand:#4f46e5;--brand2:#7c3aed}body.dark{--bg:#0b1020;--fg:#e5e9f5;--muted:#94a3b8;--card:#141a2e;--line:#233}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-weight:800;font-size:1.15rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:700;font-size:.9rem;border:0;cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.wrap{padding:40px 20px;max-width:1200px;margin:0 auto}
h1{font-size:1.8rem;font-weight:900;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;margin-bottom:12px;background:var(--bg);color:var(--fg)}
label{font-size:.85rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.admin-layout{display:grid;grid-template-columns:260px 1fr;gap:24px}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr}}
.admin-sidebar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;height:fit-content;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.admin-sidebar h4{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin:14px 0 6px}
.admin-sidebar h4:first-child{margin-top:0}
.admin-sidebar a{display:block;padding:7px 10px;border-radius:8px;color:var(--fg);font-size:.85rem;text-decoration:none}
.admin-sidebar a:hover,.admin-sidebar a.active{background:rgba(79,70,229,.1);color:var(--brand)}
.status-msg{font-size:.85rem;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none}
.status-msg.ok{display:block;background:rgba(16,185,129,.12);color:#059669}
.status-msg.err{display:block;background:rgba(239,68,68,.12);color:#dc2626}
body{display:flex;min-height:100vh;align-items:center;justify-content:center}</style>
</head><body>
<div class="card" style="width:100%;max-width:380px">
<h1 style="font-size:1.4rem;margin-bottom:16px">Admin Login</h1>
<div class="status-msg" id="msg"></div>
<form id="f"><label>Email</label><input type="email" name="email" required/><label>Password</label><input type="password" name="password" required/><button class="btn primary" style="width:100%" type="submit">Login</button></form>
<p style="font-size:.8rem;color:var(--muted);margin-top:14px">Only accounts with role <code>admin</code> or <code>super_admin</code> in the database can access the admin panel.</p>
</div>
<script>
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const msg=document.getElementById('msg');
  const data=Object.fromEntries(new FormData(e.target).entries());
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const d=await r.json();
    if(!r.ok){ msg.className='status-msg err'; msg.textContent=d.error||'Login failed.'; return; }
    if(!d.user||!['admin','super_admin'].includes(d.user.role)){ msg.className='status-msg err'; msg.textContent='This account does not have admin access.'; return; }
    localStorage.setItem('cfc_token', d.token);
    window.location.href='/admin/';
  }catch(err){ msg.className='status-msg err'; msg.textContent=err.message; }
});
</script>
</body></html>
